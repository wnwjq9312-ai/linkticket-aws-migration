<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINKTICKET - 이벤트 상세</title>
<style>
  :root{
    --navy:#1a2144;--blue:#2563eb;--text-dark:#1f2333;--text-gray:#6b7280;--border:#e5e7eb;--bg-light:#f7f8fa;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text-dark);background:#fff;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1536px;margin:0 auto;padding:0 32px;}

  header{border-bottom:1px solid var(--border);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:72px;}
  header .wrap{padding-left:12px;}
  .header-left{display:flex;align-items:center;gap:36px;}
  .logo{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
  .logo span{color:var(--blue);}
  nav.main-nav{display:flex;gap:32px;}
  nav.main-nav a{font-size:15px;font-weight:600;color:#333;padding:4px 0;}
  nav.main-nav a.active{color:var(--blue);border-bottom:2px solid var(--blue);}
  .header-right{display:flex;align-items:center;gap:20px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--bg-light);border-radius:20px;padding:8px 16px;width:280px;}
  .search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;}
  #auth-area{display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;}
  #auth-area .sep{color:var(--border);}

  .breadcrumb{padding:20px 0;font-size:13px;color:var(--text-gray);}
  .breadcrumb a{color:var(--text-gray);}
  .breadcrumb .current{color:var(--text-dark);font-weight:600;}

  .detail-hero{
    height:320px;border-radius:16px;overflow:hidden;position:relative;
    display:flex;align-items:flex-end;padding:28px;color:#fff;margin-bottom:28px;
  }
  /* event_list.html 카드 배경과 동일한 색상 - id에 따라 이 클래스가 붙음 */
  .media-1{background:linear-gradient(135deg,#3a3f6b,#1c2140);}
  .media-2{background:linear-gradient(135deg,#2b2b2b,#4a4a4a);}
  .media-3{background:linear-gradient(135deg,#6b2fb3,#a24bd6);}
  .media-4{background:linear-gradient(135deg,#4776E6,#8E54E9);}
  .media-5{background:linear-gradient(135deg,#8a2b6b,#c23c8f);}
  .media-6{background:linear-gradient(135deg,#1a2144,#3a3f6b);}
  .detail-hero .tag{
    position:absolute;top:20px;left:20px;background:#ec4899;color:#fff;
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:6px;
  }
  .detail-hero h1{font-size:28px;font-weight:800;}

  .detail-body{display:flex;gap:32px;padding-bottom:64px;align-items:flex-start;}
  .detail-main{flex:1;min-width:0;}
  .detail-side{width:320px;flex-shrink:0;}

  .info-row{display:flex;gap:10px;font-size:14px;color:var(--text-gray);margin-bottom:10px;}
  .info-row b{color:var(--text-dark);min-width:64px;}

  .section-title{font-size:17px;font-weight:800;margin:28px 0 12px;}
  .desc-block{font-size:14px;line-height:1.8;color:#444;}

  .side-card{border:1px solid var(--border);border-radius:14px;padding:20px;}
  .side-card h3{font-size:15px;font-weight:800;margin-bottom:14px;}
  .cta-btn{
    display:block;text-align:center;background:var(--blue);color:#fff;
    font-weight:700;font-size:14px;padding:14px;border-radius:10px;margin-top:16px;
  }
  .back-link{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--blue);font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="header-left">
      <a href="https://www.linkticket.com" class="logo">LINK<span>TICKET</span></a>
      <nav class="main-nav">
        <a href="https://www.linkticket.com">홈</a>
        <a href="https://www.linkticket.com/performance">공연</a>
        <a href="#">티켓예매</a>
        <a href="event_list.html" class="active">이벤트</a>
        <a href="nft_list.html">NFT</a>
        <a href="#">공지사항</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="search-box">
        <span onclick="doSearch()" style="cursor:pointer;">🔍</span>
        <input type="text" id="searchInput" placeholder="공연, 아티스트를 검색하세요..." onkeydown="if(event.key==='Enter') doSearch();">
      </div>
      <span>👤</span>
      <div id="auth-area">
        <a href="/login/">로그인</a><span class="sep">|</span><a href="/login/?tab=signup">회원가입</a>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="breadcrumb">
    <a href="event_list.html">이벤트</a> &gt; <span class="current">이벤트 상세</span>
  </div>

  <!-- 파일은 하나만 있고, URL의 ?id= 값에 따라 아래 자바스크립트가 내용을 채워 넣는 구조.
       Django로 옮기면 이 부분이 {{ event.title }} 같은 템플릿 변수로 그대로 바뀔 자리 -->
  <div class="detail-hero" id="detailHero">
    <span class="tag" id="detailTag">예매 이벤트</span>
    <h1 id="detailTitle">EARLY BIRD 할인 이벤트</h1>
  </div>

  <div class="detail-body">
    <div class="detail-main">
      <a href="event_list.html" class="back-link">← 이벤트 목록으로</a>

      <div class="info-row"><b>진행 기간</b><span id="detailDate">2025.04.01(화) ~ 2025.04.30(수)</span></div>
      <div class="info-row"><b>참여 대상</b><span>LINK TICKET 전체 회원</span></div>
      <div class="info-row"><b>진행 상태</b><span>진행중</span></div>

      <div class="section-title">이벤트 안내</div>
      <div class="desc-block" id="detailDesc">
        지금, 가장 특별한 가격으로 공연을 만나보세요!
      </div>
    </div>

    <aside class="detail-side">
      <div class="side-card">
        <h3>이벤트 요약</h3>
        <div class="info-row"><b>기간</b><span id="detailDateShort">04.01 ~ 04.30</span></div>
        <div class="info-row"><b>대상</b><span>전체 회원</span></div>
        <a href="#" class="cta-btn">공연 예매하러 가기</a>
      </div>
    </aside>
  </div>
</div>

<script>
  // 상단 검색: 키워드를 실제 검색 결과 페이지(WEB 담당의 공연 탐색 파트)로 넘겨서 이동만 시킴
  function doSearch(){
    var keyword = document.getElementById('searchInput').value.trim();
    if(!keyword){
      alert('검색어를 입력해주세요.');
      return;
    }
    window.location.href = 'https://www.linkticket.com/performances/?q=' + encodeURIComponent(keyword);
  }

  // event_list.html 카드 6개와 1:1로 매칭되는 더미 데이터.
  // 나중에 Django에서는 이 객체 대신 실제 DB에서 조회한 event 값이 들어감
  var eventData = {
    "1": { tag:"예매 이벤트",   title:"EARLY BIRD 할인 이벤트",        date:"2025.04.01(화) ~ 2025.04.30(수)", dateShort:"04.01 ~ 04.30", desc:"지금, 가장 특별한 가격으로 공연을 만나보세요! 기간 내 예매 시 선예매가와 동일한 할인 혜택을 드립니다.", media:"media-1" },
    "2": { tag:"멤버십 혜택",   title:"LINK TICKET 멤버십 특별 혜택",   date:"2025.04.01(화) ~ 상시 진행",       dateShort:"04.01 ~ 상시",  desc:"멤버십 회원만을 위한 다양한 혜택과 선예매 기회를 드립니다.", media:"media-2" },
    "3": { tag:"SNS 이벤트",    title:"공연 인증샷 이벤트",             date:"2025.04.05(토) ~ 2025.05.10(토)", dateShort:"04.05 ~ 05.10", desc:"공연장의 뜨거운 순간을 공유하고 푸짐한 선물을 받아보세요!", media:"media-3" },
    "4": { tag:"프로모션",      title:"친구와 함께 예매하면 할인!",     date:"2025.04.10(목) ~ 2025.05.15(목)", dateShort:"04.10 ~ 05.15", desc:"함께할수록 더 즐거운 공연, 지금 친구를 초대하세요!", media:"media-4" },
    "5": { tag:"팬 이벤트",     title:"아티스트 사인회 초대 이벤트",    date:"2025.04.15(화) ~ 2025.05.20(화)", dateShort:"04.15 ~ 05.20", desc:"공연 티켓 예매하고 아티스트와 가까워질 특별한 기회!", media:"media-5" },
    "6": { tag:"제휴 이벤트",   title:"제휴사 할인 혜택",               date:"2025.04.01(화) ~ 2025.06.30(월)", dateShort:"04.01 ~ 06.30", desc:"다양한 제휴사와 함께하는 특별한 할인 혜택을 만나보세요!", media:"media-6" }
  };

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || "1";
  var data = eventData[id] || eventData["1"];

  document.getElementById('detailTag').textContent = data.tag;
  document.getElementById('detailTitle').textContent = data.title;
  document.getElementById('detailDate').textContent = data.date;
  document.getElementById('detailDateShort').textContent = data.dateShort;
  document.getElementById('detailDesc').textContent = data.desc;
  document.getElementById('detailHero').classList.add(data.media);
  document.title = "LINKTICKET - " + data.title;
</script>

</body>
</html>
