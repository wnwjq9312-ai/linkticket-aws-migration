{% load static ui %}<article class="show-card"><div class="poster-wrap"><a href="{% url 'ui:detail' show.id %}">{% if show.image %}<img src="{{ show.image|image_url }}" alt="{{ show.artist }} 공연 포스터" loading="lazy">{% else %}<div class="poster-placeholder"><b>LINKTICKET</b><strong>{{ show.artist }}</strong><small>포스터 준비 중</small></div>{% endif %}</a><span class="badge">{{ show.category }}</span><button class="favorite" data-favorite="{{ show.id }}" aria-label="{{ show.artist }} 찜하기" aria-pressed="false">♡</button></div><div class="show-copy"><a href="{% url 'ui:detail' show.id %}"><h3>{{ show.title }}</h3></a><p>▣ {{ show.date }}</p><p>♧ {{ show.venue }}</p><div class="tags">{% for tag in show.tags %}<span>#{{ tag }}</span>{% endfor %}</div></div></article>
