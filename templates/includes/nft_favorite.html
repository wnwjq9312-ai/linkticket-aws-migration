{% if user.is_authenticated %}<form method="post" action="{% url 'ui:nft-favorite' item.pk %}" class="favorite-form">{% csrf_token %}<input type="hidden" name="favorite" value="{% if item.is_favorite %}0{% else %}1{% endif %}"><input type="hidden" name="origin" value="{{ favorite_origin }}"><button class="favorite-button" aria-pressed="{{ item.is_favorite|yesno:'true,false' }}" aria-label="{% if item.is_favorite %}찜 해제{% else %}NFT 찜하기{% endif %}">{% if item.is_favorite %}♥ 찜함{% else %}♡ 찜하기{% endif %}</button></form>{% else %}<a class="button small-button" href="{% url 'ui:login' %}?next={% url 'ui:nft-detail' item.pk %}">♡ 로그인하고 찜하기</a>{% endif %}
