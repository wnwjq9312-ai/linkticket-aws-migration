<header class="site-header"><div class="site-header-inner">
<a class="brand" href="{% url 'ui:home' %}">LINK<span>TICKET</span></a>
{% include 'includes/navigation.html' %}
<form class="site-search" method="get" action="{% url 'ui:performances' %}"><label class="sr-only" for="global-search">공연 검색</label><input id="global-search" name="q" placeholder="공연, 아티스트를 검색하세요…" value="{{ q }}"><button aria-label="검색">⌕</button></form>
<div class="site-auth">{% if user.is_authenticated %}<a href="{% url 'ui:mypage' %}">{{ user.first_name|default:user.username }}님</a><form method="post" action="{% url 'ui:logout' %}">{% csrf_token %}<button>로그아웃</button></form>{% else %}<a href="{% url 'ui:login' %}">♙ 로그인</a><span>|</span><a href="{% url 'ui:register' %}">회원가입</a>{% endif %}</div>
</div></header>
