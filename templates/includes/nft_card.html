<article class="nft-live-card panel"><a href="{% url 'ui:nft-detail' item.pk %}">{% if item.preview_url %}<img src="{{ item.preview_url }}" alt="{{ item.collectible_name }}">{% else %}<div class="nft-placeholder">NFT<br><small>이미지 준비 중</small></div>{% endif %}<h3>{{ item.collectible_name }}</h3></a><p class="muted">{{ item.performance.performance_name }}</p><span class="status-badge">{{ item.get_collectible_status_display }}</span>{% include 'includes/nft_favorite.html' %}</article>
