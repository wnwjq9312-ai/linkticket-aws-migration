{% load ui %}{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="{{ label|default:'목록' }} 페이지">
{% if page_obj.has_previous %}<a href="{% page_link page_obj.previous_page_number parameter|default:'page' %}" aria-label="이전 페이지">‹</a>{% endif %}
{% page_numbers page_obj as numbers %}{% for n in numbers %}{% if n == page_obj.paginator.ELLIPSIS %}<span>…</span>{% else %}<a href="{% page_link n parameter|default:'page' %}" {% if n == page_obj.number %}aria-current="page"{% endif %}>{{ n }}</a>{% endif %}{% endfor %}
{% if page_obj.has_next %}<a href="{% page_link page_obj.next_page_number parameter|default:'page' %}" aria-label="다음 페이지">›</a>{% endif %}</nav>{% endif %}
