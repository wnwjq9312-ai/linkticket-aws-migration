{% load static ui %}<div class="lt-year-poster {{ poster_class }} {% if not performance.image %}no-art{% endif %}" role="img" aria-label="{{ performance.title }} 공연 포스터">{% if performance.image %}<div class="lt-poster-photo" style="background-image:url('{{ performance.image|image_url }}')"></div>{% endif %}<div class="lt-poster-caption"><strong>{{ performance.artist }}</strong><small>LIVE PERFORMANCE</small><span>{{ performance.title }}</span></div></div>
