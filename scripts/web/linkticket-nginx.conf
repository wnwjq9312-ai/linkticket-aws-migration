
# LINKTICKET AWS WEB Configuration
# HTTPS is terminated by the AWS ALB.
# WAS_HOST is replaced by the deployment script.

upstream linkticket_was {
    server ${WAS_HOST}:8082;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    # ALB health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Static files
    location /static/ {
        alias /var/www/linkticket/;
        autoindex off;
    }

    # Media storage is not configured yet
    location /media/ {
        return 503;
    }

    # Do not expose DB backup NFS storage
    location /nft-media/ {
        return 503;
    }

    # Forward application requests to Django WAS
    location / {
        proxy_pass http://linkticket_was;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Do not retry payment requests after failure
        proxy_next_upstream error timeout;
    }
}
